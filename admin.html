<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pakistan Clinic Korea Admin</title>
<meta name="theme-color" content="#14503A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='%23235B45' stroke='%23C9A24A' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23C9A24A'%3EHS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: a working desk in the brand colours. Green header, cream desk, paper cards;
     each booking is one row that opens in place. Status is carried by a pill and the card's edge. */
  --green:#14503A; --green-2:#235B45; --green-3:#0F3F2E;
  --gold:#C9A24A; --gold-ink:#7A5B17; --gold-tint:#F3E7C3;
  --desk:#F1EBDA; --paper:#FFFCF3; --ink:#17382B; --muted:#5C6B61; --line:#DCD2B6; --taken:#E9E2CD;
  --red:#B03030; --red-ink:#7E1F1F; --red-tint:#F5DFD9;
  --font:'Poppins','Noto Naskh Arabic','Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
h1,h2{margin:0;text-wrap:balance}

.demo{background:var(--gold-tint);color:var(--ink);font-size:12.5px;text-align:center;padding:6px 16px}
.top{background:var(--green);color:var(--paper);border-bottom:2px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.badge{flex:none;width:42px;height:42px;border:2px solid var(--gold);border-radius:11px;display:grid;place-items:center;color:var(--gold);font:700 15.5px/1 var(--font);background:var(--green-2)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:600;font-size:15.5px;letter-spacing:.04em;line-height:1.2}
.brand span{font:500 10px/1.3 var(--font-mono);letter-spacing:.16em;color:var(--gold)}
.top button{appearance:none;border:1.5px solid rgba(201,162,74,.7);background:transparent;color:var(--paper);border-radius:10px;min-height:38px;padding:4px 12px;font-size:13.5px;cursor:pointer}

main{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:21px;font-weight:700}
.card h2{font-size:17px;font-weight:600}
.auth{max-width:420px;margin:24px auto;width:100%}
.hint{margin:0;color:var(--muted);font-size:13.5px}
.empty{margin:0;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.sec{font:500 12px/1.4 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-top:6px}
.err{margin:0;background:var(--red-tint);color:var(--red-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{appearance:none;text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hot{background:var(--green);border-color:var(--green);color:var(--paper)}
.stat.hot span{color:#D5DFD2}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;min-height:40px;padding:6px 14px;cursor:pointer;font-size:14px;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:1.5px solid var(--green);background:var(--green);color:var(--paper);border-radius:11px;min-height:46px;padding:8px 16px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.sm{min-height:40px;padding:6px 12px;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--green-3)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.quiet{background:transparent;border-color:transparent;color:var(--red-ink);text-decoration:underline;font-weight:500}
.btn:disabled{opacity:.6;cursor:progress}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--green);font-weight:500;font-size:14px;text-decoration:underline;cursor:pointer;align-self:flex-start}
#view{display:flex;flex-direction:column;gap:10px}

.bk{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:14px;overflow:hidden}
.bk.s-pending{border-inline-start-color:var(--gold)}
.bk.s-proposed{border-inline-start-color:var(--gold)}
.bk.s-confirmed{border-inline-start-color:var(--green)}
.bk.s-cancelled,.bk.s-noshow{border-inline-start-color:var(--red)}
.bk-h{appearance:none;width:100%;text-align:start;border:0;background:transparent;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.bk-h b{font-weight:600;font-size:15.5px}
.bk-h .dim{color:var(--muted);font-size:13px}
.bk.open .bk-h{border-bottom:1px solid var(--line)}
.pill{justify-self:start;align-self:flex-start;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--taken);color:var(--ink);margin-bottom:2px}
.pill.pending{background:var(--gold);color:var(--green-3)}
.pill.proposed{background:var(--gold-tint);color:var(--gold-ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
.pill.confirmed{background:var(--green);color:var(--paper)}
.pill.cancelled,.pill.noshow{background:var(--red-tint);color:var(--red-ink)}
.bk-d{padding:14px;display:flex;flex-direction:column;gap:14px}
.info{margin:0;display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.next{background:var(--gold-tint);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.next p{margin:0;font-size:14px}
.flag{justify-self:start;font-size:12px;font-weight:600;color:var(--red-ink);background:var(--red-tint);border-radius:999px;padding:1px 9px}
.panel{display:flex;flex-direction:column;gap:8px}
.rem{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rem>div{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 170px}
.rem>div b{font-weight:600;font-size:14.5px}
.rem>div span{font-size:12.5px;color:var(--muted)}
.rem .st-ok{font-size:13px;font-weight:600;color:var(--green)}
.rem .st-wait{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.lab{font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink)}
textarea{min-height:76px;resize:vertical;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--paper)}
.warnbox{margin:0;background:var(--red-tint);color:var(--red-ink);border-radius:10px;padding:10px 12px;font-size:14px}

.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-weight:600;font-size:16.5px}
.cal-h button{appearance:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:19px;font-weight:600}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:11.5px;color:var(--muted)}
.day{appearance:none;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:50px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.day b{font-weight:600;font-size:14.5px;line-height:1;font-variant-numeric:tabular-nums}
.day i{font-style:normal;font-size:10.5px;line-height:1;min-width:18px;padding:2px 5px;border-radius:999px;background:var(--green);color:var(--paper);font-weight:600}
.day i.z{background:transparent;color:transparent}
.day.off{background:transparent;border-style:dashed;color:#8C927F}
.day.hol{background:var(--red-tint);border-color:var(--red-tint)}
.day.blk{background:var(--taken)}
.day.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.day.sel{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-inline-end:6px;vertical-align:-2px;border:1.5px solid var(--line);background:#fff}
.legend .l-o i{border-style:dashed;background:transparent}
.legend .l-h i{background:var(--red-tint);border-color:var(--red-tint)}
.legend .l-b i{background:var(--taken);border-color:var(--taken)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14.5px}
.list li:last-child{border-bottom:0;padding-bottom:0}

.modal{position:fixed;inset:0;background:rgba(15,63,46,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:18px;font-weight:700}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--green-3);color:var(--paper);border-radius:12px;padding:10px 16px;font-size:14.5px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Preview with sample patients. Nothing on this page is real, saved or sent.</div>
<header class="top"><div class="wrap">
  <div class="badge" aria-hidden="true">HS</div>
  <div class="brand"><b>PAKISTAN CLINIC KOREA</b><span>ADMIN · BOOKINGS</span></div>
  <button type="button" id="refresh" data-refresh="1" hidden>Refresh</button>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>

<!--CONFIG-->
<script src="core.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const P=PCK;
const API=(window.PCK_CONFIG&&window.PCK_CONFIG.api)||"";
const DEMO=!API;
const engine=DEMO?P.createEngine(P.demoEnv()):null;
function call(req){
  if(DEMO) return new Promise(function(res){setTimeout(function(){res(engine.handle(JSON.parse(JSON.stringify(req))));},250);});
  const once=function(){
    const ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},30000);
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(req),redirect:"follow",signal:ctl.signal})
      .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();})
      .finally(function(){clearTimeout(tm);});
  };
  return once();
}
const ses={get:function(k){try{return sessionStorage.getItem(k)||"";}catch(e){return "";}},set:function(k,v){try{sessionStorage.setItem(k,v);}catch(e){/* stays signed in for this page load only */}},del:function(k){try{sessionStorage.removeItem(k);}catch(e){/* nothing stored */}}};
const esc=P.esc;
const $=function(s){return document.querySelector(s);};

const STATUS={pending:"New request",proposed:"Waiting for customer",confirmed:"Confirmed",done:"Done",noshow:"No-show",cancelled:"Cancelled"};
const ERR={conflict:"That time overlaps another booking or a blocked time.",time:"Choose a valid date and time.",notfound:"This booking no longer exists. Press Refresh.",invalid:"That is not possible for this booking in its current status.",
  server:"The server had a problem. Try again.",network:"No connection to the server. Check the internet and try again.",name:"Enter the patient's name (at least 2 letters).",phone:"Enter a phone number with 8 to 15 digits, or leave it empty.",
  email:"Enter a valid email address.",cat:"Choose the treatment.",loc:"Choose the location.",badpass:"Wrong password.",locked:"Too many wrong tries. Wait 15 minutes and try again.",badcode:"That setup code is not correct.",
  weak:"Use at least 8 characters.",nopass:"No password has been created yet.",mismatch:"The two passwords are not the same.",dob:"The date of birth is not valid."};
const LANGS={en:"English",ur:"Urdu",ko:"Korean"};
const DURS=[["60","1 hour"],["90","1.5 hours"],["120","2 hours"],["180","3 hours"],["240","4 hours"],["360","6 hours"],["480","8 hours"]];
const TIMES=(function(){const o=[];for(let t=360;t<=1320;t+=30)o.push([P.hm(t),P.fmtTime(t,"en")]);return o;})();

const A={phase:"boot",token:"",hasPassword:true,data:null,tab:"new",open:null,modal:null,busy:false,q:"",filt:"all",limit:60,month:"",day:"",
  auth:{code:"",pw:"",pw2:"",err:""},after:null,notes:{},setForm:null,loadedAt:0};

/* ---------- data helpers ---------- */
const B=function(){return A.data?A.data.bookings:[];};
const find=function(ref){return B().filter(function(b){return b.ref===ref;})[0]||null;};
const byWhen=function(a,b){const x=a.date+" "+a.start,y=b.date+" "+b.start;return x<y?-1:x>y?1:0;};
const durText=function(m){m=Number(m);return m%60===0?(m/60)+" h":(Math.round(m/6)/10)+" h";};
const timeText=function(b){const t=P.parseHm(b.start);return isNaN(t)?b.start:P.fmtTime(t,"en");};
const whenText=function(b){return P.fmtDate(b.date,"en")+" · "+timeText(b)+(Number(b.dur)&&Number(b.dur)!==P.CFG.block?" ("+durText(b.dur)+")":"");};
const catName=function(b){const c=P.cat(b.cat);return c?c.name.en:b.cat;};
const meetOf=function(b){return P.meetText(P.clinicFor(b.cat,b.loc),"en");};
const msgKind=function(st){return {pending:"received",proposed:"proposed",confirmed:"confirmed",cancelled:"cancelled"}[st]||"";};
function busyFor(except){
  const out=[];
  B().forEach(function(b){if(!P.HOLD[b.status]||b.ref===except)return;const s=P.parseHm(b.start);if(!isNaN(s))out.push({d:b.date,s:s,m:Number(b.dur)||P.CFG.block});});
  (A.data.blocks||[]).forEach(function(k){const s=P.parseHm(k.start),e=P.parseHm(k.end);if(!isNaN(s)&&!isNaN(e)&&e>s)out.push({d:k.date,s:s,m:e-s});});
  return out;
}
const holidayOf=function(ds){return (A.data.holidays||[]).filter(function(h){return h.date===ds;})[0]||null;};
function dayNote(ds){
  if(!P.isDate(ds))return "";
  const h=holidayOf(ds),w=P.dow(ds),n=[];
  if(P.CFG.off.indexOf(w)>=0)n.push("This is one of your days off ("+P.DOW.en[w]+").");
  if(h)n.push("Public holiday: "+h.name+".");
  return n.join(" ");
}

/* ---------- server ---------- */
function api(action,extra){
  return call(Object.assign({action:action,token:A.token},extra||{})).then(function(r){
    if(r&&r.error==="auth"){A.token="";ses.del("pck-admin");A.phase="login";A.modal=null;A.busy=false;A.auth.err="";render();throw new Error("auth");}
    return r;
  });
}
function toast(text){
  const el=$("#toast");if(!text){el.hidden=true;return;}
  el.textContent=text;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},4500);
}
function send(action,payload,okMsg,after){
  if(A.busy)return Promise.resolve();
  A.busy=true;renderModal();
  return api(action,payload).then(function(r){
    A.busy=false;
    if(r&&r.ok){if(r.data){A.data=r.data;A.loadedAt=Date.now();}A.modal=null;if(after)after(r);toast(typeof okMsg==="function"?okMsg(r):okMsg);render();}
    else{const e=(r&&r.error)||"server";if(A.modal){A.modal.err=e;renderModal();}else{toast(ERR[e]||ERR.server);render();}}
  }).catch(function(e){
    A.busy=false;if(e&&e.message==="auth")return;
    if(A.modal){A.modal.err="network";renderModal();}else{toast(ERR.network);render();}
  });
}
function act(req,kind){
  return send("admin.act",req,function(r){
    if(r.deleted)return "Booking deleted.";
    if(kind==="confirmed")return r.emailed?"Confirmed. Email sent to the customer.":"Confirmed.";
    if(kind==="proposed")return r.emailed?"New time offered. Email sent to the customer.":"New time offered.";
    if(kind==="cancelled")return r.emailed?"Cancelled. Email sent to the customer.":"Cancelled.";
    return "Saved.";
  },function(r){
    if(r.deleted){A.open=null;A.after=null;return;}
    A.open=req.ref;A.after=kind?{ref:req.ref,kind:kind,emailed:!!r.emailed}:null;
    reveal(req.ref);
  });
}
/* After a change, move to the tab where the booking now lives so its "next step" stays in view. */
function reveal(ref){
  const b=find(ref);if(!b)return;
  const isNew=b.status==="pending"||b.status==="proposed",isUp=b.status==="confirmed",toAll=function(){A.tab="all";A.filt="all";A.q="";};
  if(A.tab==="new"&&!isNew){if(isUp)A.tab="up";else toAll();}
  else if(A.tab==="up"&&!isUp){if(isNew)A.tab="new";else toAll();}
  else if(A.tab==="cal"){if(b.status==="cancelled")toAll();else{A.day=b.date;A.month=b.date.slice(0,7);}}
  else if(A.tab==="all"&&A.filt!=="all"&&A.filt!==b.status)A.filt="all";
}
function load(silent){
  return api("admin.data").then(function(r){
    if(r&&r.ok){A.data=r.data;A.loadedAt=Date.now();if(A.phase!=="in"){A.phase="in";A.month=r.data.today.slice(0,7);A.day=r.data.today;}if(!silent)toast("Up to date.");render();}
    else if(!silent){toast(ERR.server);}
  }).catch(function(e){if(e&&e.message==="auth")return;if(A.phase!=="in"){A.phase="error";render();}else if(!silent)toast(ERR.network);});
}
function copyText(text,title){
  const fallback=function(){A.modal={type:"text",title:title,text:text};renderModal();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied.");},fallback);return;}}catch(e){/* fall through to the text box */}
  fallback();
}

/* ---------- small builders ---------- */
const field=function(label,control,hint){return '<div class="field"><span class="lab">'+esc(label)+'</span>'+control+(hint?'<p class="hint">'+esc(hint)+'</p>':"")+'</div>';};
const select=function(attr,opts,cur){return '<select '+attr+'>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(cur)===String(o[0])?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>';};
const timeSelect=function(key,cur){const opts=TIMES.some(function(o){return o[0]===cur;})||!cur?TIMES:[[cur,cur]].concat(TIMES);return select('data-m="'+key+'" data-re="1" aria-label="Time"',opts,cur);};
const sumLine=function(b){return '<p class="hint"><b>'+esc(b.name)+'</b> · '+esc(catName(b))+'<br>'+esc(whenText(b))+' · '+esc(meetOf(b))+'</p>';};
function notifyRow(b,m){
  if(b.contact==="email"&&b.email)return '<label class="check"><input type="checkbox" data-m="notify"'+(m.notify?" checked":"")+'><span>Email the customer now ('+esc(b.email)+')</span></label>';
  return '<p class="hint">This customer chose WhatsApp. After you save, a ready WhatsApp message appears on the booking.</p>';
}

  }
  else if(m.type==="text"){title=m.title;save="";body='<textarea readonly rows="11" aria-label="'+esc(m.title)+'">'+esc(m.text)+'</textarea><p class="hint">Select the text and copy it.</p>';}
  return '<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet"><h2>'+esc(title)+'</h2>'+body+(m.err?'<p class="err" role="alert">'+esc(ERR[m.err]||ERR.server)+'</p>':"")
    +'<div class="row">'+(save?'<button type="button" class="btn'+(danger?" danger":"")+'" data-save="1"'+(A.busy?" disabled":"")+'>'+(A.busy?"Please wait…":esc(save))+'</button>':"")+'<button type="button" class="btn ghost" data-close="1">'+(save?"Back":"Close")+'</button></div></div></div>';
}
function renderModal(){$("#modal").innerHTML=modalHtml();}
function render(){
  $("#demo").hidden=!DEMO;$("#refresh").hidden=A.phase!=="in";
  let h="";
  if(A.phase==="boot")h='<p class="empty">Loading…</p>';
  else if(A.phase==="error")h='<section class="card auth"><h1>Cannot reach the server</h1><p class="hint">Check the internet connection, then try again.</p><div class="row"><button type="button" class="btn" data-retry="1">Try again</button></div></section>';
  else if(A.phase==="login"||A.phase==="setup")h=vAuth();
  else h=vMain();
  $("#app").innerHTML=h;renderModal();
}

/* ---------- actions ---------- */
function saveModal(){
  const m=A.modal;if(!m||A.busy)return;
  if(m.type==="confirm")return act({ref:m.ref,act:"confirm",notify:!!m.notify},"confirmed");
  if(m.type==="move")return act({ref:m.ref,act:m.mode,date:m.date,start:m.start,dur:Number(m.dur),force:!!m.force,notify:!!m.notify},m.mode==="propose"?"proposed":"confirmed");
  if(m.type==="cancel")return act({ref:m.ref,act:"cancel",reason:m.reason,notify:!!m.notify},"cancelled");
  if(m.type==="delete")return act({ref:m.ref,act:"delete"},null);
  if(m.type==="add"){
    if(!m.cat){m.err="cat";return renderModal();}
    const c=P.cat(m.cat);if(c.clinics.length>1&&!m.loc){m.err="loc";return renderModal();}
    return send("admin.add",{force:!!m.force,booking:{cat:m.cat,loc:m.loc,date:m.date,start:m.start,dur:Number(m.dur),name:m.name,phone:m.phone,lang:m.lang,adminNote:m.adminNote,status:"confirmed"}},"Booking added.",function(r){A.open=r.ref;A.tab="cal";A.day=m.date;A.month=m.date.slice(0,7);});
  }
  if(m.type==="block")return send("admin.block",{date:m.date,allDay:!!m.allDay,start:m.start,end:m.end,note:m.note},"Time blocked.",function(){A.tab="cal";A.day=m.date;A.month=m.date.slice(0,7);});
}
function doAuth(kind){
  const a=A.auth;if(A.busy)return;
  if(kind==="tosetup"||kind==="tologin"){A.phase=kind==="tosetup"?"setup":"login";a.err="";a.pw="";a.pw2="";return render();}
  if(kind==="setup"&&a.pw!==a.pw2){a.err="mismatch";return render();}
  if(kind==="setup"&&a.pw.length<8){a.err="weak";return render();}
  A.busy=true;a.err="";render();
  call(kind==="setup"?{action:"admin.setPassword",code:a.code.trim().toUpperCase(),password:a.pw}:{action:"admin.login",password:a.pw}).then(function(r){
    A.busy=false;
    if(r&&r.ok){A.token=r.token;ses.set("pck-admin",r.token);A.hasPassword=true;a.pw="";a.pw2="";a.code="";A.phase="boot";render();return load(true);}
    a.err=(r&&r.error)||"server";render();
  }).catch(function(){A.busy=false;a.err="network";render();});
}
document.addEventListener("click",function(ev){
  const el=ev.target.closest("button");if(!el)return;const d=el.dataset;
  if(d.auth)return doAuth(d.auth);
  if(d.retry){A.phase="boot";render();return boot();}
  if(d.refresh)return load(false);
  if(d.logout){A.token="";ses.del("pck-admin");A.data=null;A.phase="login";A.auth.err="";return render();}
  if(d.tab){A.tab=d.tab;if(d.day){A.day=d.day;A.month=d.day.slice(0,7);}if(d.tab==="set")A.setForm=null;A.limit=60;return render();}
  if(d.open){A.open=A.open===d.open?null:d.open;if(!A.after||A.after.ref!==A.open)A.after=null;return render();}
  if(d.close){A.modal=null;return renderModal();}
  if(d.save)return saveModal();
  if(d.act){
    const b=find(d.ref);if(!b)return;
    if(d.act==="confirm")A.modal={type:"confirm",ref:b.ref,notify:true,err:""};
    else if(d.act==="propose"||d.act==="reschedule")A.modal={type:"move",mode:d.act,ref:b.ref,date:b.date,start:b.start,dur:String(Number(b.dur)||P.CFG.block),force:false,notify:true,err:""};
    else if(d.act==="cancel")A.modal={type:"cancel",ref:b.ref,reason:"",notify:true,err:""};
    else if(d.act==="delete")A.modal={type:"delete",ref:b.ref,err:""};
    else if(d.act==="note")return send("admin.act",{ref:b.ref,act:"note",note:A.notes[b.ref]!==undefined?A.notes[b.ref]:(b.adminNote||"")},"Note saved.",function(){delete A.notes[b.ref];});
    else return act({ref:b.ref,act:d.act},null);
    return renderModal();
  }
  if(d.copy){
    const b=find(d.ref);if(!b)return;
    if(d.copy==="ko")return copyText(P.clinicSummaryKo(b,A.data.today),"Korean summary for the clinic");
    if(d.copy==="rem")return copyText(msgText("reminder",b),"Reminder for the customer");
    return copyText(msgText(msgKind(b.status),b),"Message for the customer");
  }
  const base=A.tab==="cal"?A.day:A.data?A.data.today:"";
  if(d.add){A.modal={type:"add",cat:"",loc:"",date:base,start:"10:00",dur:"120",name:"",phone:"",lang:"en",adminNote:"",force:false,err:""};return renderModal();}
  if(d.block){A.modal={type:"block",date:base,allDay:true,start:"09:30",end:"18:00",note:"",err:""};return renderModal();}
  if(d.unblock)return send("admin.unblock",{id:d.unblock},"Block removed.");
  if(d.hol)return send("admin.holiday",{date:d.hol,open:d.to==="1"},d.to==="1"?"Holiday opened for online booking.":"Holiday closed for online booking.");
  if(d.setk){const p={};p[d.setk]=Number(d.val);return send("admin.settings",p,"Saved.");}
  if(d.saveset){const f=A.setForm||{};return send("admin.settings",{notifyEmail:f.notifyEmail,adminUrl:f.adminUrl,bookingUrl:f.bookingUrl},"Saved.",function(){A.setForm=null;});}
  if(d.cmonth){A.month=P.addMonths(A.month+"-01",Number(d.cmonth)).slice(0,7);return render();}
  if(d.cday){A.day=d.cday;return render();}
  if(d.filt){A.filt=d.filt;A.limit=60;return render();}
  if(d.more){A.limit+=60;return render();}
});
function onField(ev){
  const el=ev.target,d=el.dataset||{};
  if(d.a){A.auth[d.a]=el.value;return;}
  if(d.m&&A.modal){A.modal[d.m]=el.type==="checkbox"?el.checked:el.value;if(d.m==="cat")A.modal.loc="";if(d.m!=="force")A.modal.err="";if(d.re){if(el.type==="date"){const c=$("#clash");if(c)c.innerHTML=clashNote(A.modal);}else if(ev.type==="change")renderModal();}return;}
  if(d.note){A.notes[d.note]=el.value;return;}
  if(d.q){if(ev.type!=="input")return;A.q=el.value;A.limit=60;const l=$("#list");if(l)l.innerHTML=listAll();return;}
  if(d.s&&A.setForm){A.setForm[d.s]=el.value;}
}
document.addEventListener("input",onField);document.addEventListener("change",onField);
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.a&&(A.phase==="login"||A.phase==="setup")){ev.preventDefault();doAuth(A.phase);}
  if(ev.key==="Escape"&&A.modal&&!A.busy){A.modal=null;renderModal();}
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&A.phase==="in"&&!A.modal&&!A.busy&&Date.now()-A.loadedAt>60000)load(true);});

function boot(){
  if(DEMO)return call({action:"admin.login",password:"demo"}).then(function(r){A.token=r.token;return load(true);});
  A.token=ses.get("pck-admin");
  if(A.token)return load(true);
  return call({action:"admin.state"}).then(function(r){
    if(!r||!r.ok){A.phase="error";return render();}
    A.hasPassword=!!r.hasPassword;A.phase=A.hasPassword?"login":"setup";render();
  }).catch(function(){A.phase="error";render();});
}
render();
boot();
})();
</script>
</body>
</html>
