<style>
:root{
  /* Layout: one phone-width column on the poster's green field. Cream cards hold each step;
     gold marks the current step and the meeting point; red is kept for booked times and warnings. */
  --green:#14503A; --green-2:#235B45; --green-3:#0F3F2E;
  --gold:#C9A24A; --gold-ink:#7A5B17;
  --cream:#F7F2E4; --paper:#FFFCF3; --ink:#17382B; --muted:#5C6B61; --line:#DCD2B6; --taken:#ECE5D1;
  --red:#B03030; --red-ink:#7E1F1F; --red-tint:#F5DFD9;
  --font-latin:'Poppins','Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif;
  --font-ur:'Noto Naskh Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  --font-ur-display:'Noto Nastaliq Urdu','Noto Naskh Arabic','Geeza Pro',serif;
  --font-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--green);color:var(--cream);font-family:var(--font-latin);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
html[lang=ur] body{font-family:var(--font-ur);font-size:17.5px;line-height:1.9}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font-latin)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.preview{background:var(--cream);color:var(--ink);font-size:12.5px;line-height:1.5;text-align:center;padding:6px 16px}

.top{border-bottom:1px solid var(--gold)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding-block:14px}
.badge{flex:none;width:46px;height:46px;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font:700 17px/1 var(--font-latin);background:var(--green-2)}
.brand{flex:1 1 190px;min-width:0;display:flex;flex-direction:column;gap:3px;direction:ltr;text-align:left}
.brand b{font:600 16.5px/1.2 var(--font-latin);letter-spacing:.04em;color:#fff}
.brand span{font:500 10px/1.3 var(--font-mono);letter-spacing:.16em;color:var(--gold)}
.lang{display:flex;border:1.5px solid var(--gold);border-radius:999px;padding:3px;gap:2px;direction:ltr}
.lang button{appearance:none;border:0;background:transparent;color:var(--cream);border-radius:999px;padding:4px 12px;min-height:34px;cursor:pointer;font:500 13.5px/1.2 var(--font-latin)}
.lang button[lang=ur]{font-family:var(--font-ur);font-size:15px}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--green-3);font-weight:700}

.hero{padding-block:22px 4px;display:flex;flex-direction:column;gap:8px}
.hero h1{margin:0;font:700 26px/1.2 var(--font-latin);color:var(--cream);text-wrap:balance}
html[lang=ur] .hero h1{font:700 25px/2.3 var(--font-ur-display)}
.hero p{margin:0;color:#E2E8DB;font-size:15px;max-width:48ch}
html[lang=ur] .hero p{font-size:16.5px}
.hero a{color:var(--gold);font-size:14px;font-weight:500}
html[lang=ur] .hero a{font-size:15.5px}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.35;color:#B9CBBE}
html[lang=ur] .steps li{font-size:13.5px;line-height:1.7}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--green-2)}
.steps li.done{color:var(--cream)}
.steps li.done::before{background:var(--cream)}
.steps li.now{color:var(--gold);font-weight:600}
.steps li.now::before{background:var(--gold)}

.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:18px 16px 20px;margin-block:16px;display:flex;flex-direction:column;gap:16px}
.card h2{margin:0;font:700 20px/1.25 var(--font-latin);text-wrap:balance}
html[lang=ur] .card h2{font:700 19.5px/2.3 var(--font-ur-display)}
.label{font:500 11.5px/1.4 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
html[lang=ur] .label{font:700 15px/1.8 var(--font-ur);letter-spacing:0}
html[lang=ko] .label{letter-spacing:.06em;font-family:var(--font-latin);font-size:12.5px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:14px}
html[lang=ur] .hint{font-size:15.5px}
.sum{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px}
.sum b{color:var(--ink);font-weight:600}
html[lang=ur] .sum{font-size:15px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{appearance:none;text-align:start;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;min-height:76px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.opt b{font-weight:600;font-size:15.5px;line-height:1.3}
.opt span{color:var(--muted);font-size:12.5px;line-height:1.4}
html[lang=ur] .opt b{font-size:17px;line-height:1.7;font-weight:700}
html[lang=ur] .opt span{font-size:14px;line-height:1.7}
.opt[aria-pressed=true]{background:var(--green);border-color:var(--gold);color:var(--cream)}
.opt[aria-pressed=true] span{color:#D5DFD2}
@media (max-width:340px){.opts{grid-template-columns:1fr}}

.meet{border-radius:14px;overflow:hidden;background:var(--green-2);color:var(--cream)}
.meet-h{background:var(--gold);color:var(--green-3);padding:7px 14px;font:500 11.5px/1.4 var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
html[lang=ur] .meet-h{font:700 15px/1.8 var(--font-ur);letter-spacing:0}
html[lang=ko] .meet-h{font:600 12.5px/1.4 var(--font-latin);letter-spacing:.06em}
.meet-b{padding:14px;display:flex;flex-direction:column;gap:10px}
.st{display:flex;flex-direction:column;gap:1px}
.st b{font:700 21px/1.25 var(--font-latin)}
html[lang=ur] .st b{font:700 21px/1.8 var(--font-ur)}
.st small{color:var(--gold);font-size:13.5px}
.meet .or{font-size:12.5px;color:#C9D6CB}
.meet .cl{border-top:1px solid rgba(201,162,74,.45);padding-top:10px;font-size:13.5px;color:#DDE6DA}
html[lang=ur] .meet .cl{font-size:15px}
.meet .pick{font-size:13.5px;color:#DDE6DA}
html[lang=ur] .meet .pick{font-size:15px}
.loc{appearance:none;text-align:start;width:100%;background:transparent;border:1.5px solid rgba(201,162,74,.5);border-radius:12px;padding:10px 12px;color:var(--cream);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.loc i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);margin-top:6px;display:block}
.loc[aria-pressed=true]{background:var(--green);border-color:var(--gold)}
.loc[aria-pressed=true] i{background:var(--gold);box-shadow:inset 0 0 0 3px var(--green)}
.loc .cl2{grid-column:2;font-size:13px;color:#DDE6DA}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;font-size:14.5px;line-height:1.3}
html[lang=ur] .chip{font-size:15.5px;line-height:1.7}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--cream)}

.nav{display:flex;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;min-height:50px;padding:10px 18px;font-weight:600;font-size:16px;line-height:1.3;cursor:pointer;background:var(--green);color:var(--cream);flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
html[lang=ur] .btn{font-size:17.5px;font-weight:700;line-height:1.7}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.btn.gold{background:var(--gold);color:var(--green-3)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--red-ink);border-color:#E5BDB4}
.okbox{margin:0;background:#E2ECE4;color:var(--green);border-radius:12px;padding:12px 14px;font-weight:600}
.btn:disabled{opacity:.6;cursor:progress}
.err{margin:0;background:var(--red-tint);color:var(--red-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
html[lang=ur] .err{font-size:15.5px}

.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:17px;font-weight:600}
.cal-h button{appearance:none;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:600 20px/1 var(--font-latin);color:var(--ink)}
.cal-h button:disabled{opacity:.35;cursor:default}
[dir=rtl] .cal-h button{transform:scaleX(-1)}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:11.5px;color:var(--muted)}
html[lang=ur] .dow span{font-size:11px;line-height:1.6}
.day{appearance:none;border:1.5px solid transparent;border-radius:10px;background:var(--paper);min-height:52px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink)}
.day b{font:600 15.5px/1 var(--font-latin);font-variant-numeric:tabular-nums}
.day small{font-size:9.5px;line-height:1.2}
html[lang=ur] .day small{font-size:11px;line-height:1.5}
.day:disabled{cursor:default}
.day.na{background:transparent;color:#A9AE9E}
.day.na b{font-weight:400}
.day.off{background:transparent;border:1.5px dashed var(--line);color:#8C927F}
.day.off b{font-weight:400}
.day.hol{background:var(--red-tint);color:var(--red-ink)}
.day.full{background:var(--taken);color:#8B8872}
.day.open{border-color:var(--line)}
.day.sel{background:var(--green);border-color:var(--gold);color:var(--cream)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}
html[lang=ur] .legend{font-size:14px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-inline-end:6px;vertical-align:-2px;border:1.5px solid var(--line);background:var(--paper)}
.legend .l-b i{background:var(--taken);border-color:var(--taken)}
.legend .l-o i{background:transparent;border-style:dashed}
.legend .l-h i{background:var(--red-tint);border-color:var(--red-tint)}

.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;min-height:52px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.slot b{font:600 15px/1.2 var(--font-latin);font-variant-numeric:tabular-nums;direction:ltr}
.slot small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
html[lang=ur] .slot small{font-size:12.5px;letter-spacing:0;line-height:1.5}
.slot.taken{background:var(--taken);border-color:transparent;cursor:default;color:#8B8872}
.slot.taken b{text-decoration:line-through;font-weight:500}
.slot.taken small{color:var(--red)}
.slot.sel{background:var(--green);border-color:var(--gold);color:var(--cream)}
.notice{background:var(--red-tint);color:var(--red-ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.notice b{font-size:16px}
.notice p{margin:0;font-size:14.5px}
html[lang=ur] .notice p{font-size:16px}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px;padding-block:8px}
.wait i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green);flex:none}
.aside{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--muted)}
html[lang=ur] .aside{font-size:15.5px}
.aside a{color:var(--green);font-weight:600}
.tiny{margin:0;font-size:12.5px;color:var(--muted)}
html[lang=ur] .tiny{font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-weight:600;font-size:15px}
html[lang=ur] .field>label,html[lang=ur] .field>.lab{font-size:16.5px;font-weight:700}
.opt-tag{font-weight:400;color:var(--muted);font-size:13px}
html[lang=ur] .opt-tag{font-size:14.5px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;color:var(--ink)}
textarea{min-height:92px;resize:vertical;display:block}
.dob{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:8px}

.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--green);font-weight:600;font-size:14px;text-decoration:underline;cursor:pointer}
html[lang=ur] .link{font-size:15.5px}
.review{margin:0;display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:8px 14px;font-size:15px}
html[lang=ur] .review{font-size:16px}
.review dt{color:var(--muted)}
.review dd{margin:0;font-weight:500;overflow-wrap:anywhere}
html[lang=ur] .review dd{font-weight:600}
.rule{height:1px;background:var(--line);border:0;margin:0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
html[lang=ur] .consent{font-size:16px}
.consent input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--green)}

.ref{background:var(--green-2);color:var(--cream);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.ref span{font-size:13px;color:#DDE6DA}
html[lang=ur] .ref span{font-size:15px}
.ref b{font:500 27px/1.3 var(--font-mono);letter-spacing:.06em;color:var(--gold);direction:ltr}
.warn{margin:0;background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
html[lang=ur] .warn{font-size:16.5px;font-weight:700}
.pill{align-self:flex-start;border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px;background:var(--taken);color:var(--ink)}
html[lang=ur] .pill{font-size:15.5px;font-weight:700}
.pill.confirmed{background:var(--green);color:var(--cream)}
.pill.proposed{background:var(--gold);color:var(--green-3)}
.pill.cancelled,.pill.noshow{background:var(--red-tint);color:var(--red-ink)}

.foot{background:var(--gold);color:var(--green-3);margin-top:28px}
.foot .wrap{padding-block:18px 24px;display:flex;flex-direction:column;gap:12px}
.foot .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.foot .q{font-weight:600;font-size:15px}
html[lang=ur] .foot .q{font-size:16.5px;font-weight:700}
.foot a.num{font:700 24px/1.15 var(--font-latin);color:var(--green-3);text-decoration:none;direction:ltr}
.foot .soc{margin:0;font-size:12.5px;line-height:1.6;direction:ltr;text-align:left;font-family:var(--font-latin);border-top:1px solid rgba(15,63,46,.3);padding-top:10px}
@media (prefers-reduced-motion:no-preference){
  .opt,.chip,.slot,.day,.btn{transition:background-color .12s,border-color .12s,color .12s}
  .wait i{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
}
</style>
</head>
<body>
<div class="preview" id="pv" hidden></div>
<header class="top"><div class="wrap">
  <div class="badge" aria-hidden="true">HS</div>
  <div class="brand"><b>PAKISTAN CLINIC KOREA</b><span>BY HS · TARJUMA · HOSPITAL SAATH</span></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="ur" lang="ur">اردو</button>
    <button type="button" data-lang="ko" lang="ko">한국어</button>
  </div>
</div></header>
<main class="wrap">
  <section class="hero"><h1 id="h1"></h1><p id="lede"></p><a id="swap" href="#status"></a><ol class="steps" id="steps"></ol></section>
  <div id="app"></div>
</main>
<footer class="foot"><div class="wrap">
  <div class="row"><span class="q" id="footQ"></span><a class="num" id="footNum" target="_blank" rel="noopener">+82 10-9522-6111</a></div>
  <p class="soc">TikTok · Pakistan Clinic Korea by HS<br>Facebook · Pakistan Clinic Korea by HS<br>Instagram · Korea Medical Services by HS</p>
</div></footer>

/* ---------- server calls ---------- */
function call(req){
  if(DEMO) return new Promise(function(res){setTimeout(function(){res(engine.handle(JSON.parse(JSON.stringify(req))));},300);});
  const once=function(){
    const ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},25000);
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(req),redirect:"follow",signal:ctl.signal})
      .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();})
      .finally(function(){clearTimeout(tm);});
  };
  return once().catch(function(){return new Promise(function(r){setTimeout(r,1200);}).then(once);});
}

const newId=function(){try{if(crypto.randomUUID)return crypto.randomUUID();}catch(e){/* fall through */}return "c"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);};

  AV.today=a.today;AV.busy=a.busy||[];AV.closed=a.closed||[];AV.minNoticeDays=a.minNoticeDays;AV.maxMonths=a.maxMonths;
  AV.minDate=P.addDays(AV.today,AV.minNoticeDays);AV.maxDate=P.addMonths(AV.today,AV.maxMonths);AV.state="ready";

  h+='<dl class="review"><dt>'+esc(t("rTreat"))+'</dt><dd>'+esc(L(c.name))+'</dd><dt>'+esc(t("rWhen"))+'</dt><dd>'+esc(fmtDate(S.date))+' · <span class="ltr">'+esc(fmtTime(S.time))+'</span></dd><dt>'+esc(t("rWhere"))+'</dt><dd>'+esc(meetText(cl))+'</dd></dl>';
  h+='<div class="nav"><a class="btn gold" target="_blank" rel="noopener" href="'+wa(fill(t("mDone"),{ref:S.ref,cat:L(c.name),date:fmtDate(S.date),time:S.lang==="ur"?"\u2066"+fmtTime(S.time)+"\u2069":fmtTime(S.time)}))+'">'+esc(t("doneWa"))+'</a></div>';
  return h+'<div class="nav"><button type="button" class="btn ghost" style="flex:1" data-again="1">'+esc(t("again"))+'</button></div></section>';
}
function vStatus(){
  const q=S.q;
  let h='<section class="card"><h2>'+esc(t("stTitle"))+'</h2>';
  h+='<div class="field"><label for="q-ref">'+esc(t("stRef"))+'</label><input type="text" id="q-ref" data-q="ref" class="ltr" autocomplete="off" autocapitalize="characters" maxlength="20" placeholder="PCK-1116-ABC" value="'+esc(q.ref)+'"></div>';
  h+='<div class="field"><label for="q-phone">'+esc(t("stPhone"))+'</label><input type="tel" id="q-phone" data-q="phone" class="ltr" inputmode="tel" autocomplete="tel" maxlength="30" value="'+esc(q.phone)+'"></div>';
  if(q.err&&!q.res)h+='<p class="err" role="alert">'+esc(t("err")[q.err]||t("err").server)+'</p>';
  h+='<div class="nav"><button type="button" class="btn" data-check="1"'+(q.busy?" disabled":"")+'>'+esc(q.busy?t("checking"):t("stBtn"))+'</button></div>';
  if(q.res){
    const r=q.res,c=P.cat(r.cat),cl=P.clinicFor(r.cat,r.loc),tm=P.parseHm(r.start),live=r.status==="pending"||r.status==="proposed"||r.status==="confirmed";
    h+='<hr class="rule"><div class="block" id="result">'+(q.err?'<p class="err" role="alert">'+esc(t("err")[q.err]||t("err").server)+'</p>':"")+'<span class="pill '+esc(r.status)+'">'+esc(t("status")[r.status]||r.status)+'</span>';
    if(t("statusText")[r.status])h+='<p class="hint">'+esc(t("statusText")[r.status])+'</p>';
    h+='<dl class="review"><dt>'+esc(t("ref"))+'</dt><dd><span class="ltr">'+esc(r.ref)+'</span></dd><dt>'+esc(t("rTreat"))+'</dt><dd>'+esc(c?L(c.name):r.cat)+'</dd><dt>'+esc(t("rWhen"))+'</dt><dd>'+esc(fmtDate(r.date))+' · <span class="ltr">'+esc(isNaN(tm)?r.start:fmtTime(tm))+'</span></dd>'
      +(live&&cl?'<dt>'+esc(t("rWhere"))+'</dt><dd>'+esc(meetText(cl))+'<br><span class="opt-tag">'+esc(clinicName(cl))+'</span></dd>':"")+'</dl>';
    if(q.cancelled)h+='<p class="okbox" role="status">'+esc(t("cancelDone"))+'</p>';
    else if(r.canCancel&&!q.ask)h+='<div class="nav"><button type="button" class="btn ghost danger" style="flex:1" data-cask="1">'+esc(t("cancelBtn"))+'</button></div>';
    else if(r.canCancel)h+='<div class="notice" id="cq"><b>'+esc(fill(t("cancelQ"),{ref:r.ref}))+'</b><div class="nav"><button type="button" class="btn ghost" data-cno="1">'+esc(t("cancelNo"))+'</button><button type="button" class="btn danger" data-cyes="1"'+(q.busy?" disabled":"")+'>'+esc(q.busy?t("cancelling"):t("cancelYes"))+'</button></div></div>';
    h+='</div>';
  }
  return h+'</section>';
}

/* ---------- render + events ---------- */
function render(scroll){
  const html=document.documentElement;html.lang=S.lang;html.dir=S.lang==="ur"?"rtl":"ltr";
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===S.lang);});
  const pv=$("#pv");pv.hidden=!DEMO;pv.textContent=t("preview");
  $("#h1").textContent=t("h1");
  $("#lede").hidden=S.view==="status";$("#lede").textContent=t("lede");
  const sw=$("#swap");sw.textContent=S.view==="status"?t("stBack"):t("stLink");sw.setAttribute("href",S.view==="status"?"#book":"#status");
  const steps=$("#steps");steps.hidden=S.view==="status";
  steps.innerHTML=t("steps").map(function(s,i){return '<li class="'+(i+1<S.step?"done":i+1===S.step?"now":"")+'"'+(i+1===S.step?' aria-current="step"':"")+'>'+(i+1)+'. '+esc(s)+'</li>';}).join("");
  $("#footQ").textContent=t("footQ");$("#footNum").href=wa(t("mGen"));
  $("#app").innerHTML=S.view==="status"?vStatus():[null,vStep1,vStep2,vStep3,vStep4,vDone][S.step]();
  if(scroll){const el=typeof scroll==="string"?$(scroll):$(".hero");if(el)el.scrollIntoView({block:typeof scroll==="string"?"nearest":"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function check(step){
  if(step===1){const c=curCat();if(!c)return "cat";if(c.clinics.length>1&&!S.loc)return "loc";return null;}
  if(step===2){if(AV.state!=="ready"||!S.date||S.time==null||AV.closed.indexOf(S.date)>=0)return "time";
    return P.slotsFor(S.date,curClinic(),AV.busy).some(function(s){return s.t===S.time&&s.free;})?null:"time";}
  if(step===3){const v=P.cleanBooking(Object.assign(payload(),{consent:true}),AV,false);return v.error||null;}
  return null;
}
const stepOf=function(e){return e==="cat"||e==="loc"?1:e==="time"||e==="taken"?2:3;};
function go(n){
  if(n>S.step){for(let s=S.step;s<n;s++){const e=check(s);if(e){S.err=e;S.step=Math.min(s,stepOf(e));render();const eb=$(".err");if(eb)eb.scrollIntoView({block:"center"});return;}}}
  S.err=null;S.step=n;render(true);
}
function submit(){
  if(S.sending)return;
  if(!S.f.consent){S.err="consent";render();return;}
  const e=check(1)||check(2)||check(3);if(e){S.step=stepOf(e);S.err=e;render(true);return;}
  S.sending=true;S.err=null;render();
  call({action:"book",booking:payload()}).then(function(r){
    S.sending=false;
    if(r&&r.ok){S.ref=r.ref;S.step=5;S.err=null;store.set("pck-ref",r.ref);S.q.ref=r.ref;render(true);loadAvail();return;}
    const err=(r&&r.error)||"server";
    if(err==="taken"){if(r.avail&&r.avail.ok)setAvail(r.avail);S.time=null;S.step=2;S.err="taken";render(true);return;}
    S.err=t("err")[err]?err:"server";
    if(err!=="limit"&&err!=="busy"&&err!=="server"&&err!=="invalid")S.step=stepOf(err);
    render();const eb=$(".err");if(eb)eb.scrollIntoView({block:"center"});
  }).catch(function(){S.sending=false;S.err="network";render();const eb=$(".err");if(eb)eb.scrollIntoView({block:"center"});});
}
function checkStatus(){
  const q=S.q;if(q.busy)return;
  q.busy=true;q.err=null;q.res=null;q.ask=false;q.cancelled=false;render();
  call({action:"status",ref:q.ref,phone:q.phone}).then(function(r){q.busy=false;if(r&&r.ok)q.res=r;else q.err=(r&&r.error==="notfound")?"notfound":"server";render(q.res?"#result":null);})
    .catch(function(){q.busy=false;q.err="network";render();});
}
function cancelBooking(){
  const q=S.q;if(q.busy||!q.res)return;
  q.busy=true;q.err=null;render("#cq");
  call({action:"cancel",ref:q.res.ref,phone:q.phone}).then(function(r){
    q.busy=false;q.ask=false;
    if(r&&r.ok){q.res=r;q.cancelled=true;loadAvail();}
    else{q.err=(r&&r.error)||"server";if(q.err==="closed"||q.err==="toolate")q.res.canCancel=false;}
    render("#result");
  }).catch(function(){q.busy=false;q.err="network";render("#result");});
}
document.addEventListener("click",function(ev){
  const el=ev.target.closest("button");if(!el)return;const d=el.dataset;
  if(d.lang){S.lang=d.lang;store.set("pck-lang",S.lang);render();return;}
  if(d.cat){if(S.cat!==d.cat){S.cat=d.cat;S.loc=null;S.needs=[];S.date=null;S.time=null;S.clientId=newId();}S.err=null;render("#picked");return;}
  if(d.loc){S.loc=d.loc;S.date=null;S.time=null;S.err=null;render();return;}
  if(d.need!==undefined){const i=Number(d.need),k=S.needs.indexOf(i);if(k<0)S.needs.push(i);else S.needs.splice(k,1);render();return;}
  if(d.go){go(Number(d.go));return;}
  if(d.reload){loadAvail();render();return;}
  if(d.month){S.month=P.addMonths(S.month+"-01",Number(d.month)).slice(0,7);render();return;}
  if(d.date){S.date=d.date;S.time=null;S.err=null;render("#times");return;}
  if(d.time){S.time=Number(d.time);S.err=null;render();return;}
  if(d.set){S.f[d.set]=d.val;S.err=null;render();return;}
  if(d.submit){submit();return;}
  if(d.check){checkStatus();return;}
  if(d.cask){S.q.ask=true;S.q.err=null;render("#cq");return;}
  if(d.cno){S.q.ask=false;render("#result");return;}
  if(d.cyes){cancelBooking();return;}
  if(d.again){Object.assign(S,{step:1,cat:null,loc:null,needs:[],month:AV.minDate.slice(0,7),date:null,time:null,err:null,ref:null,sending:false,clientId:newId(),f:blankForm()});render(true);}
});
function onField(ev){
  const ds=ev.target.dataset||{};
  if(ds.q){S.q[ds.q]=ev.target.value;return;}
  const k=ds.f;if(!k)return;
  S.f[k]=ev.target.type==="checkbox"?ev.target.checked:ev.target.value;
  if(k==="nat"&&ev.type==="change"){render();const o=$("#f-natOther");if(o)o.focus();}
}
document.addEventListener("input",onField);document.addEventListener("change",onField);
window.addEventListener("hashchange",function(){S.view=location.hash==="#status"?"status":"book";S.q.err=null;render(true);});
render();
loadAvail();
})();
</script>
</body>
</html>
